name: Try app approve and merge

# Manual only. Answers: does a GitHub App's approving review satisfy a ruleset's
# required_approving_review_count? The merge attempts are the real evidence —
# mergeable_state is informative but undocumented, so it is only printed.
#
# Everything goes to stdout (the run log) as well as the step summary: an error
# body visible only in the summary is an error body that is awkward to quote.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to test against
        required: true
        default: "1"

# The default GITHUB_TOKEN is deliberately never used for anything here: it is
# subject to the separate "Allow GitHub Actions to create and approve pull
# requests" setting, which would confound the result.
permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # The exact action Phase 5 will use, so this rehearses that step too.
      - name: Mint an App installation token
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TEST_APP_ID }}
          private-key: ${{ secrets.TEST_APP_KEY }}

      - name: Approve as the App, then try to merge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ inputs.pr }}
        run: |
          set -u
          exec > >(tee -a "$GITHUB_STEP_SUMMARY") 2>&1

          say() { printf '\n=== %s ===\n' "$1"; }

          say "identity"
          gh api /installation/repositories --jq '.repositories[].full_name' || true

          say "before: pr state"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" \
            --jq '"mergeable=\(.mergeable) mergeable_state=\(.mergeable_state)"' || true

          say "before: merge attempt (expected to FAIL)"
          gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$PR/merge" -f merge_method=merge || true

          say "approve as the App (full response body)"
          gh api -X POST "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" \
            -f event=APPROVED -f body='Approving as the App, to see whether this counts.' || true

          say "reviews now on the PR"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" \
            --jq 'if length == 0 then "NONE" else .[] | "\(.state) by \(.user.login) type=\(.user.type)" end' || true

          # GitHub recomputes mergeability asynchronously after a review lands.
          sleep 10

          say "after: pr state"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" \
            --jq '"mergeable=\(.mergeable) mergeable_state=\(.mergeable_state)"' || true

          say "after: merge attempt (success => App approvals count)"
          gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$PR/merge" -f merge_method=merge || true
